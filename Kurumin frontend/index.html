<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eletro Kurumin - Gestão de Estoque</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <!-- TELA DE AUTENTICAÇÃO / LOGIN -->
  <div id="tela-login" class="login-container">
    <div class="card login-card">
      <h2>Eletro Kurumin</h2>
      <p class="sub-title">Aceda à sua conta para gerir o stock</p>
      
      <form id="form-login">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="senha">Palavra-passe</label>
          <input type="password" id="senha" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Iniciar Sessão</button>
      </form>
    </div>
  </div>

  <!-- PAINEL PRINCIPAL (CRUD E RELATÓRIO) -->
  <div id="painel-principal" class="container" style="display: none;">
    <header>
      <h1>Eletro Kurumin - Painel de Controle</h1>
      <button class="btn-sair" id="btn-sair">Sair</button>
    </header>

    <main>
      <!-- Gestão de Componentes (CRUD Form) -->
      <section class="card">
        <h2>Cadastrar / Editar Componente</h2>
        <form id="form-componente">
          <input type="hidden" id="componente-id">
          
          <div class="form-row">
            <input type="text" id="nome" placeholder="Nome do Componente" required>
            <select id="id_categoria" required>
              <option value="">Selecione a Categoria</option>
            </select>
          </div>

          <div class="form-row">
            <input type="number" step="0.01" id="preco" placeholder="Preço (R$)" required>
            <input type="number" id="quantidade_estoque" placeholder="Quantidade em Estoque" required>
          </div>

          <div class="form-row">
            <textarea id="descricao" placeholder="Descrição do componente" rows="3"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-salvar">Salvar Componente</button>
            <button type="button" class="btn-cancelar" id="btn-cancelar" style="display: none;">Cancelar Edit</button>
          </div>
        </form>
      </section>

      <!-- Relatório e Tabela de Componentes -->
      <section class="card">
        <div class="table-header">
          <h2>Lista de Componentes</h2>
          <span class="badge-total">Valor Total do Estoque: R$ <span id="valor-total">0.00</span></span>
        </div>

        <table id="tabela-componentes">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Descrição</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Carregado via JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
